<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Veeraraju Elluru — choose research or dev." />
  <link rel="canonical" href="https://veeraraju-e.github.io/portfolio/" />
  <title>Veeraraju Elluru</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <ul class="toggle" role="listbox" aria-label="Site version">
    <li role="option">
      <a href="research/" data-option aria-selected="true">research/</a>
    </li>
    <li role="option">
      <a href="dev/" data-option aria-selected="false">dev/</a>
    </li>
  </ul>

  <script>
    const options = Array.from(document.querySelectorAll("[data-option]"));
    let index = 0;

    function select(next) {
      index = (next + options.length) % options.length;
      options.forEach((option, i) => {
        option.setAttribute("aria-selected", i === index ? "true" : "false");
      });
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown" || event.key === "j") {
        event.preventDefault();
        select(index + 1);
        return;
      }

      if (event.key === "ArrowUp" || event.key === "k") {
        event.preventDefault();
        select(index - 1);
        return;
      }

      if (event.key === "Enter") {
        event.preventDefault();
        window.location.href = options[index].getAttribute("href");
      }
    });
  </script>
</body>

</html>
